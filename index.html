            ctx.restore();
          }

          // FEVER画面ティント
          if (state.fever) {
            ctx.save();
            const a = 0.14 + 0.06 * Math.sin(state.time * 8);
            const tint = ctx.createLinearGradient(0, 0, 0, H);
            tint.addColorStop(0, `rgba(255,216,120,${a})`);
            tint.addColorStop(1, `rgba(120,255,200,${a*0.75})`);
            ctx.fillStyle = tint;
            ctx.fillRect(0, 0, W, H);
            ctx.restore();
          }

          // Platforms
          for (const p of platforms) {
            if (p.safe) {
              if (p.oyasumi) continue; // おやすみカターンは専用描画（drawOyasumi）で行う
              const alpha = (state.safeFading && state.safePlatformId === p.id) ? Math.max(0, 1 - state.safeFadeT) : 1;
              ctx.save();
              ctx.globalAlpha = alpha;

              // ベッド画像が読み込まれていれば画像を、そうでなければ赤いバー
              // 赤いバー
              ctx.fillStyle = '#cc0000';
              ctx.fillRect(p.x, p.y, p.w, p.h);

              ctx.restore();
              continue;
            }
            // 通常足場の点滅（消滅直前0.5秒）
            const blink = (p.decayT != null && p.decayT >= (PLATFORM_DECAY_LIMIT - 0.5));
            if (blink) {
              const phase = p.decayT - (PLATFORM_DECAY_LIMIT - 0.5);
              const visible = (Math.floor((phase) / 0.1) % 2) === 0; // 0.1秒ごとに交互
              if (!visible) continue; // 非表示フレーム
            }
            // 通常足場はフェーズごとに見た目を変える（赤バーは別処理で不変）
            drawPhasePlatform(ctx, p);
          }

          // おやすみカターン（休憩の避難所）をプレイヤーの背面に描画
          drawOyasumi(ctx);

          // Sugars (collectibles)
          for (const s of sugars) {
            const t = state.time;
            const pulse = 0.6 + 0.4 * Math.sin(t * 6 + s.id);
            const r = s.r * (0.9 + 0.15 * pulse);
            const g = ctx.createRadialGradient(s.x, s.y, 1, s.x, s.y, r*2.2);
            if (state.fever) {
              g.addColorStop(0, 'rgba(255,255,200,0.95)');
              g.addColorStop(1, 'rgba(180,255,200,0)');
            } else {
              g.addColorStop(0, 'rgba(255,240,180,0.9)');
              g.addColorStop(1, 'rgba(255,180,80,0)');
            }
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(s.x, s.y, r*1.6, 0, Math.PI*2); ctx.fill();
            // core
            ctx.fillStyle = state.fever ? '#ffff88' : '#ffd96a';
            ctx.beginPath();
            ctx.moveTo(s.x, s.y - r);
            for (let i = 1; i < 6; i++) {
              const ang = -Math.PI/2 + i * (Math.PI*2/6);
              ctx.lineTo(s.x + Math.cos(ang) * r, s.y + Math.sin(ang) * r);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = state.fever ? 'rgba(220,255,200,0.9)' : 'rgba(255,220,120,0.8)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
          
          // Item（30秒ごとに落下・同時1個）
          if (state.activeItem) {
            const it = state.activeItem;
            // 発光（小さなグロー）
            const pulse = 0.6 + 0.4 * Math.sin(it.glow || 0);
            const r = 34 * (0.8 + 0.2 * pulse);
            const g = ctx.createRadialGradient(it.x, it.y, 6, it.x, it.y, r);
            g.addColorStop(0, 'rgba(255,255,200,0.85)');
            g.addColorStop(1, 'rgba(255,240,120,0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(it.x, it.y, r, 0, Math.PI*2); ctx.fill();
            // きらめき
            ctx.save();
            ctx.translate(it.x, it.y);
            ctx.rotate((it.spin || 0) * 0.5);
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            for (let i=0;i<4;i++){
              ctx.rotate(Math.PI/2);
              ctx.fillRect(-2, -18, 4, 36);
            }
            ctx.restore();
            // 本体画像（アイテム種類に応じて）
            const iw = 56, ih = 56;
            ctx.save();
            ctx.translate(it.x, it.y);
            ctx.rotate(Math.sin(it.spin || 0) * 0.12);
            const iconImg = (it.kind === 'ultra') ? MEGA_ITEM_IMG : ITEM_IMG;
            ctx.drawImage(iconImg, -iw/2, -ih/2, iw, ih);
            ctx.restore();
          }

          // Player: グルコースマン（または変身キャラ）
          const drawSink = 4; // 接地感のため全体を少し下げる
          // 跳ねる演出を完全に無効化
          const hover = 0;
          const yAdj = (player.footY - player.h) - hover + drawSink;
          drawShadow(player.x, yAdj, player.w, player.h, anim);
          // 変身中はキャラ描画を完全に差し替え（サイズ据え置き）
          if (state.power && state.power.kind) {
            // ほのかな発光
            const cx = player.x + player.w/2;
            const cy = yAdj + player.h/2;
            const rr = Math.max(player.w, player.h);
            const gg = ctx.createRadialGradient(cx, cy, 12, cx, cy, rr*0.9);
            gg.addColorStop(0, 'rgba(255,255,200,0.22)');
            gg.addColorStop(1, 'rgba(255,240,120,0)');
            ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(cx, cy, rr*0.9, 0, Math.PI*2); ctx.fill();
            // 差し替え本体（アスペクト比維持、スケール無効、傾きのみ）
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(anim.tilt);
            ctx.translate(-cx, -cy);
            const img = (state.power.kind === 'ultra') ? MEGA_TRANSFORM_IMG : TRANSFORM_IMG;
            const nw = (img.naturalWidth||img.width||1);
            const nh = (img.naturalHeight||img.height||1);
            const cropB = Math.max(0, Math.min(nh-1, getImgBottomCrop(img)));
            const srcX = 0, srcY = 0, srcW = nw, srcH = Math.max(1, nh - cropB);
            const aspect = srcW / srcH;
            const ih = player.h;
            const iw = Math.round(ih * aspect);
            const dx = Math.round(cx - iw/2);
            const dy = Math.round(yAdj);
            ctx.drawImage(img, srcX, srcY, srcW, srcH, dx, dy, iw, ih);
            ctx.restore();
          } else {
            // 通常キャラ
            const sleeping = !state.gameOver;
            // 復帰直後の無敵中は点滅で知らせる
            if (state.respawnInvuln > 0) {
              ctx.save();
              ctx.globalAlpha = 0.45 + 0.35 * Math.sin(state.time * 22);
              drawCharacter(player.x, yAdj, player.w, player.h, anim, sleeping);
              ctx.restore();
            } else {
              drawCharacter(player.x, yAdj, player.w, player.h, anim, sleeping);
            }
          }

          // Debug: 足元の十字と当たり枠（dev=1/2 で有効）
          try {
            const showDbg = /[?&](hitbox|debug)=1/.test(location.search);
            if (showDbg) {
              const cx = player.x + player.w/2;
              const fy = player.footY;
              // 足元の十字
              ctx.save();
              ctx.strokeStyle = 'rgba(255,0,0,0.6)';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(cx-12, fy); ctx.lineTo(cx+12, fy);
              ctx.moveTo(cx, fy-12); ctx.lineTo(cx, fy+12);
              ctx.stroke();
              ctx.restore();
              // 当たり枠（0.75倍のAABB、上方シフト含む）
              const pw = player.w * 0.75;
              const ph = player.h * 0.75;
              const px = player.x + (player.w - pw) * 0.5;
              const py = (player.footY - ph) - hbOffset();
              ctx.save();
              ctx.strokeStyle = 'rgba(0,200,255,0.65)';
              ctx.fillStyle = 'rgba(0,200,255,0.10)';
              ctx.lineWidth = 2;
              ctx.strokeRect(px, py, pw, ph);
              ctx.fillRect(px, py, pw, ph);
              ctx.restore();
            }
          } catch(_){}
          // 差し替え描画は上で実行済み

          // HUD（左上に小さく、フェーズ名＋スコアのみ）
          hud.style.color = world.hudColor;
          const phaseLabelsHUD2 = {
            phase1: '現世のうつしよ ― 光の回廊',
            phase2: '第二階層 ― 揺らぎの明晰夢',
            phase3: '第三階層 ― 時間が伸びる世界',
            final:  '夢の楽園 ― 夢の楽園'
          };
          hud.textContent = `フェーズ: ${phaseLabelsHUD2[currentPhase]||currentPhase} ／ スコア: ${state.score}`;

          // === 代謝演出レイヤー（インスリン/フィーバー/リング/粒子/オーラ/ゲージ/セリフ）===
          // インスリンスパイク：景色はそのまま、青紫の淡いフィルターと「呼吸するような明滅」
          if (state.insulin.active) {
            const k = insulinK(); // 1→0
            const breathe = 0.5 + 0.5 * Math.sin(state.time * 2.0); // ゆっくり呼吸
            const env = 0.45 + 0.55 * k;                            // 開始で濃く、回復で薄く
            const a = (0.13 + 0.07 * breathe) * env;
            ctx.save();
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, `rgba(120,110,200,${a*0.95})`);  // 青紫
            g.addColorStop(1, `rgba(60,55,120,${a})`);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
            // 画面端のまどろみビネット
            const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.7);
            vg.addColorStop(0, 'rgba(0,0,0,0)');
            vg.addColorStop(1, `rgba(35,30,70,${a*1.15})`);
            ctx.fillStyle = vg;
            ctx.fillRect(0, 0, W, H);
            ctx.restore();
          }
          // フィーバー覚醒演出（背景は変えず、景色そのものが目覚めたように）
          if (state.fever) {
            const t = state.time;
            ctx.save();
            // 画面端の淡い暖色発光
            const eg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.40, W/2, H/2, Math.max(W,H)*0.64);
            eg.addColorStop(0, 'rgba(255,235,150,0)');
            eg.addColorStop(1, `rgba(255,210,110,${0.16 + 0.05 * Math.sin(t*6)})`);
            ctx.fillStyle = eg;
            ctx.fillRect(0, 0, W, H);
            // 軽い速度線（縦の淡いストリークが上へ流れる＝高揚感）
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = 'rgba(255,245,200,0.10)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 6; i++) {
              const x = ((i * 131 + t * 220) % (W + 40)) - 20;
              const len = 60 + ((i * 53) % 80);
              const y = (H + len) - ((i * 197 + t * 300) % (H + len));
              ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - len); ctx.stroke();
            }
            ctx.restore();
          }
          // フィーバー突入フラッシュ
          if (state.feverFlash > 0) {
            ctx.save();
            ctx.fillStyle = `rgba(255,245,200,${0.5 * state.feverFlash})`;
            ctx.fillRect(0, 0, W, H);
            ctx.restore();
          }
          // 光リング（着地・糖・フィーバー）
          for (const rg of landRings) {
            const k = Math.min(1, rg.life / rg.ttl);
            const ease = 1 - Math.pow(1 - k, 2);
            const cur = rg.r0 + (rg.maxR - rg.r0) * ease;
            const alpha = Math.max(0, 1 - k);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = `rgba(${rg.color},${alpha * 0.9})`;
            ctx.lineWidth = rg.w * (1 - k*0.6);
            ctx.beginPath();
            ctx.arc(rg.x, rg.y, cur, 0, Math.PI*2);
            ctx.stroke();
            ctx.restore();
          }
          // 粒子（キラキラ）
          if (particles.length) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (const p of particles) {
              const k = Math.min(1, p.life / p.ttl);
              const alpha = Math.max(0, 1 - k);
              ctx.globalAlpha = alpha;
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r * (1 - k*0.4), 0, Math.PI*2);
              ctx.fill();
            }
            ctx.restore();
          }
          // フィーバーオーラ（プレイヤーの周り）
          if (state.fever && !(state.power && state.power.kind)) {
            const cx = player.x + player.w/2;
            const cy = (player.footY || (player.y + player.h)) - player.h/2;
            const rr = Math.max(player.w, player.h);
            const pulse = 0.5 + 0.5 * Math.sin(state.time * 9);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const gg = ctx.createRadialGradient(cx, cy, 8, cx, cy, rr * (0.8 + 0.12*pulse));
            gg.addColorStop(0, 'rgba(255,235,150,0.30)');
            gg.addColorStop(1, 'rgba(255,210,90,0)');
            ctx.fillStyle = gg;
            ctx.beginPath(); ctx.arc(cx, cy, rr*0.95, 0, Math.PI*2); ctx.fill();
            // 回転する甘さのリング
            ctx.strokeStyle = `rgba(255,240,180,${0.4 + 0.3*pulse})`;
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(cx, cy, rr*0.62, 0, Math.PI*2); ctx.stroke();
            ctx.restore();
          }
          // 情報カターン（もうひとりの主人公）を描画
          drawKataan(ctx, W, H);

          // 残機表示（画面上部・右端に小さく）：アイコン× N
          {
            const n = Math.max(0, state.lives|0);
            const ih2 = 22, iw2 = 22;
            const numTxt = '× ' + n;
            ctx.save();
            ctx.font = 'bold 16px system-ui, sans-serif';
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            const tw = ctx.measureText(numTxt).width;
            const padX = 8, gap = 3;
            const bw = padX + iw2 + gap + tw + padX, bh = 28;
            const bx = W - bw - 8, by = 8, cyl = by + bh/2;
            ctx.fillStyle = 'rgba(20,24,40,0.5)';
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 9); ctx.fill(); }
            else ctx.fillRect(bx, by, bw, bh);
            const icon = charSpriteReady ? charSprite : null;
            const ix = bx + padX;
            if (icon) {
              const ar = (icon.naturalWidth||1) / (icon.naturalHeight||1);
              const dh3 = ih2, dw3 = dh3 * ar;
              ctx.drawImage(icon, ix + (iw2 - dw3)/2, cyl - dh3/2, dw3, dh3);
            } else {
              ctx.fillStyle = '#9b5de5';
              ctx.beginPath(); ctx.arc(ix + iw2/2, cyl, ih2*0.42, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = '#ffffff';
            ctx.fillText(numTxt, ix + iw2 + gap, cyl + 1);
            ctx.restore();
          }

          // 変身状態の常時表示（画面上部・中央）
          if (state.power && state.power.kind) {
            const isBird = (state.power.kind === 'triple');
            const label = isBird ? '🐦 無限二段ジャンプ中' : '💪 安定着地モード中';
            ctx.save();
            ctx.font = 'bold 16px system-ui, sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            const tw = ctx.measureText(label).width;
            const padX = 12, bw = tw + padX*2, bh = 26, bx = (W - bw)/2, by = 18;
            ctx.fillStyle = 'rgba(20,24,40,0.55)';
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 9); ctx.fill(); }
            else ctx.fillRect(bx, by, bw, bh);
            ctx.fillStyle = isBird ? '#bfe6ff' : '#ffd9a0';
            ctx.fillText(label, W/2, by + 5);
            // 残り時間の細いバー（20秒）
            const ratio = Math.max(0, Math.min(1, state.power.t / 20));
            ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(bx, by + bh - 3, bw, 3);
            ctx.fillStyle = isBird ? '#7fd0ff' : '#ffc06a'; ctx.fillRect(bx, by + bh - 3, bw * ratio, 3);
            ctx.restore();
          }

          // コンボ継続ゲージ／フィーバー残り時間ゲージ（HUD下・中央寄せ）
          (function drawMetabGauges(){
            const barW = Math.min(W*0.6, 260), barH = 8, bx = (W - barW)/2;
            if (state.fever) {
              const by = 44;
              const ratio = Math.max(0, Math.min(1, state.feverRatio));
              ctx.save();
              ctx.fillStyle = 'rgba(0,0,0,0.28)';
              ctx.fillRect(bx, by, barW, barH);
              const g = ctx.createLinearGradient(bx, 0, bx+barW, 0);
              g.addColorStop(0, '#ffd96a'); g.addColorStop(1, '#aaffcc');
              ctx.fillStyle = g;
              ctx.fillRect(bx, by, barW * ratio, barH);
              ctx.fillStyle = '#fff7d0';
              ctx.font = 'bold 13px system-ui, sans-serif';
              ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
              ctx.fillText('FEVER', W/2, by - 2);
              ctx.restore();
            } else if (state.comboCount > 0) {
              const by = 44;
              const ratio = Math.max(0, Math.min(1, state.comboTime / Math.max(0.001, state.comboWindow)));
              ctx.save();
              ctx.fillStyle = 'rgba(0,0,0,0.25)';
              ctx.fillRect(bx, by, barW, barH);
              ctx.fillStyle = '#a8ffcc';
              ctx.fillRect(bx, by, barW * ratio, barH);
              ctx.restore();
            }
          })();
          // 大型コンボ表示
          if (!state.fever && state.comboMult > 1) {
            ctx.save();
            const pop = 1 + 0.06 * Math.sin(state.time * 8);
            ctx.translate(W/2, 92);
            ctx.scale(pop, pop);
            ctx.fillStyle = 'rgba(168,255,204,0.95)';
            ctx.font = 'bold 40px system-ui, sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,80,40,0.5)'; ctx.shadowBlur = 8;
            ctx.fillText(`COMBO x${state.comboMult}`, 0, 0);
            ctx.restore();
          }
          // グルコースマンのセリフ（吹き出し）
          if (speech.dur > 0 && speech.text) {
            const k = speech.t / Math.max(0.001, speech.dur);
            const alpha = (k < 0.12) ? (k/0.12) : (k > 0.8 ? Math.max(0, 1-(k-0.8)/0.2) : 1);
            const cx = player.x + player.w/2;
            const cyTop = (player.footY || (player.y + player.h)) - player.h - 14;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = 'bold 19px system-ui, sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const tw = ctx.measureText(speech.text).width;
            const padX = 12, bw = tw + padX*2, bh = 30;
            let bxs = cx - bw/2;
            bxs = Math.max(8, Math.min(W - bw - 8, bxs)); // 画面内に収める
            const bys = Math.max(70, cyTop - bh);
            ctx.fillStyle = 'rgba(20,24,40,0.62)';
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bxs, bys, bw, bh, 10); ctx.fill(); }
            else { ctx.fillRect(bxs, bys, bw, bh); }
            ctx.fillStyle = speech.color || '#fff';
            ctx.fillText(speech.text, bxs + bw/2, bys + bh/2 + 1);
            ctx.restore();
          }

          // ポップアップ描画
          for (const p of popups) {
            const alpha = Math.max(0, 1 - p.life / 1.0);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color || '#fff';
            ctx.font = 'bold 36px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p.text, p.x, p.y);
            ctx.restore();
          }
          
          // 背景ティント効果（外部phase-control.jsとの連携用）
          if (typeof tintBackground === 'function') {
            tintBackground(ctx, canvas.width, canvas.height);
          }
          
          // 画面揺れの状態を復元
          ctx.restore();
        }

        function drawCharacter(x, y, w, h, anim, sleeping=false) {
          if (charSpriteReady || glucoRReady || glucoLReady) return drawSpriteMan(x, y, w, h, anim, sleeping);
          return drawGlucoseMan(x, y, w, h, anim, sleeping);
        }

        function drawSpriteMan(x, y, w, h, anim, sleeping=false) {
          ctx.save();
          const cx = x + w/2;
          const cy = y + h/2;
          const sx = 1 - (anim.squash - 1) * 0.25;
          const sy = anim.squash;
          ctx.translate(cx, cy);
          ctx.rotate(anim.tilt);
          ctx.scale(sx, sy);
          ctx.translate(-cx, -cy);
          // 中央に画像をhに合わせて描画
          const onSafeBar = (!state.activated && state.safePlatformId != null && player.groundId === state.safePlatformId);
          const useSleep = (state.gameOver || onSafeBar) && charSpriteSleepReady;
          // 横移動中のみ左右別画像（反転なし）。停止中・バー上は正面画像(charSprite)に戻す
          const faceSpr = player.moving ? ((player.facing < 0) ? (glucoLReady ? GLUCO_L : null)
                                                               : (glucoRReady ? GLUCO_R : null))
                                        : null;
          const spr = useSleep ? charSpriteSleep : (faceSpr || charSprite);
          const iw = spr.naturalWidth || 1;
          const ih = spr.naturalHeight || 1;
          const scale = h / ih;
          const dw = iw * scale;
          const dh = h;
          const dx = cx - dw/2;
          const dy = y;
          ctx.drawImage(spr, dx, dy, dw, dh);
          ctx.restore();

          // 眠り演出（鼻バブル）は重ねて表示
          if (sleeping) {
            const t = (state.time % 2.2) / 2.2;
            const grow = t < 0.7 ? (t / 0.7) : (1 - (t - 0.7) / 0.3);
            const r = 1.5 + 5.0 * Math.max(0, grow);
            const nx = x + w*0.58 + 4 * grow;
            const ny = y + h*0.28 - 10 * grow;
            const a = 0.18 + 0.25 * Math.max(0, grow);
            const bg = ctx.createRadialGradient(nx - r*0.4, ny - r*0.6, r*0.2, nx, ny, r);
            bg.addColorStop(0, `rgba(255,255,255,${a})`);
            bg.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = bg;
            ctx.beginPath(); ctx.arc(nx, ny, r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = `rgba(255,255,255,${a * 0.9})`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(nx, ny, r, 0, Math.PI * 2); ctx.stroke();
          }
        }

        function drawCanopy(ctx, W, H, t) {
          const pal = (()=>{
            if (currentPhase === 'phase1' || currentPhase === 'phase2') return { s:'rgba(160,210,255,0.95)' };
            if (currentPhase === 'phase3') return { s:'rgba(130,90,180,0.95)' };
            return { s:'rgba(255,220,160,0.92)' };
          })();
          const y = Math.max(1, CANOPY.thickness * 0.5); // 線の半分が見えるように内側へ
          ctx.save();
          ctx.lineWidth = CANOPY.thickness;
          ctx.strokeStyle = pal.s;
          ctx.shadowColor = pal.s; ctx.shadowBlur = 12;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.restore();
        }

        function drawGlucoseMan(x, y, w, h, anim, sleeping=false) {
          ctx.save();
          const cx = x + w / 2;
          const cyAll = y + h / 2;
          // スクワッシュ＆回転
          const sx = 1 - (anim.squash - 1) * 0.5;
          const sy = anim.squash;
          ctx.translate(cx, cyAll);
          // 2段ジャンプ中はスピン回転を合成
          const extraRot = (anim.spinTime > 0 ? anim.spin : 0);
          ctx.rotate(anim.tilt + extraRot);
          ctx.scale(sx, sy);
          ctx.translate(-cx, -cyAll);

          // 頭サイズ（デザイン比率で調整）
          const hr = Math.min(h * design.headRatio, w * (design.headRatio * 1.8));
          const headTop = y;
          const cy = headTop + hr + 2; // 少し下げて配置
          const hg = ctx.createRadialGradient(cx - hr*0.3, cy - hr*0.3, hr*0.4, cx, cy, hr);
          hg.addColorStop(0, palette.head);
          hg.addColorStop(1, palette.headShade);
          ctx.fillStyle = hg;
          ctx.beginPath();
          ctx.arc(cx, cy, hr, 0, Math.PI * 2);
          ctx.fill();

          // 頭の葉っぱ（緑）: 空中でゆらぐ
          ctx.strokeStyle = palette.leafDark;
          ctx.lineWidth = 2;
          ctx.beginPath();
          const sway = Math.sin(anim.leafPhase) * (2 + anim.air * 3);
          ctx.moveTo(cx, cy - hr + 2);
          ctx.quadraticCurveTo(cx - 1 + sway * 0.2, cy - hr - 4, cx + sway * 0.2, cy - hr - 8);
          ctx.stroke();
          ctx.fillStyle = palette.leaf;
          ctx.beginPath();
          ctx.ellipse(cx - 3 + sway, cy - hr - 10, 5, 3, -0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(cx + 3 + sway, cy - hr - 8, 5, 3, 0.6, 0, Math.PI * 2);
          ctx.fill();

          // 目：通常は白目＋瞳、眠っている時は閉じ目ライン
          // 目の大きさ・位置（デザイン比率に基づく）
          const eyeOffX = Math.max(6, hr * design.eyeOffsetXR), eyeOffY = -2;
          const eyeR = Math.max(7, hr * design.eyeRadiusRatio);
          if (!sleeping) {
            const look = Math.sin(state.time * 2) * 1.2;
            // 左目
            ctx.fillStyle = palette.eyeWhite;
            ctx.beginPath(); ctx.arc(cx - eyeOffX, cy + eyeOffY, eyeR, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = palette.eyeIris;
            ctx.beginPath(); ctx.arc(cx - eyeOffX + look * 0.6, cy + eyeOffY + 0.6, eyeR * 0.48, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = palette.eyeShine; ctx.beginPath(); ctx.arc(cx - eyeOffX - eyeR*0.22, cy + eyeOffY - eyeR*0.22, Math.max(1.4, eyeR*0.26), 0, Math.PI * 2); ctx.fill();
            // 右目
            ctx.fillStyle = palette.eyeWhite;
            ctx.beginPath(); ctx.arc(cx + eyeOffX, cy + eyeOffY, eyeR, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = palette.eyeIris;
            ctx.beginPath(); ctx.arc(cx + eyeOffX + look * 0.6, cy + eyeOffY + 0.6, eyeR * 0.48, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = palette.eyeShine; ctx.beginPath(); ctx.arc(cx + eyeOffX - eyeR*0.22, cy + eyeOffY - eyeR*0.22, Math.max(1.4, eyeR*0.26), 0, Math.PI * 2); ctx.fill();
          } else {
            // 閉じ目（微笑むような弧）
            ctx.strokeStyle = 'rgba(20,16,32,0.9)';
            ctx.lineWidth = Math.max(1.8, hr * 0.07);
            ctx.beginPath(); ctx.arc(cx - eyeOffX, cy + eyeOffY + 1, eyeR * 0.9, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx + eyeOffX, cy + eyeOffY + 1, eyeR * 0.9, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
          }

          // 眉毛
          const browY = cy + eyeOffY - eyeR - Math.max(2, eyeR * 0.25);
          const browLen = Math.max(6, eyeR * 1.2);
          const browW = Math.max(2, eyeR * 0.35);
          const browColor = palette.eyeIris;
          const ang = sleeping ? 0.05 : 0.22; // 眠い時はフラット、通常は少しハの字
          ctx.strokeStyle = browColor;
          ctx.lineWidth = browW;
          ctx.lineCap = 'round';
          // 左眉
          ctx.save();
          ctx.translate(cx - eyeOffX, browY);
          ctx.rotate(-ang);
          ctx.beginPath(); ctx.moveTo(-browLen/2, 0); ctx.lineTo(browLen/2, 0); ctx.stroke();
          ctx.restore();
          // 右眉
          ctx.save();
          ctx.translate(cx + eyeOffX, browY);
          ctx.rotate(ang);
          ctx.beginPath(); ctx.moveTo(-browLen/2, 0); ctx.lineTo(browLen/2, 0); ctx.stroke();
          ctx.restore();

          // 口（穏やかなスマイル）
          ctx.strokeStyle = 'rgba(20,16,32,0.9)';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(cx + 2, cy + 6, 6, 0.2 * Math.PI, 0.8 * Math.PI);
          ctx.stroke();

          // 眠っている時の鼻バブル（透明の小さい風船）
          if (sleeping) {
            const t = (state.time % 2.2) / 2.2; // 0→1 の循環
            const grow = t < 0.7 ? (t / 0.7) : (1 - (t - 0.7) / 0.3); // 0→1→0 の簡易波形
            const r = 1.2 + 4.0 * Math.max(0, grow);
            const dx = 3 + 4 * grow; // 右へ少し移動
            const dy = -2 - 8 * grow; // 上へふわっと
            const nx = cx + 4 + dx;
            const ny = cy + 2 + dy;
            const a = 0.15 + 0.25 * Math.max(0, grow);
            // 透明感のある塗り＋縁
            const bg = ctx.createRadialGradient(nx - r*0.4, ny - r*0.6, r*0.2, nx, ny, r);
            bg.addColorStop(0, `rgba(255,255,255,${a})`);
            bg.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = bg;
            ctx.beginPath(); ctx.arc(nx, ny, r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = `rgba(255,255,255,${a * 0.9})`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(nx, ny, r, 0, Math.PI * 2); ctx.stroke();
          }

          // 服（上=明るめ、下=暗め）。下半身は今の倍の比率に拡大
          const bodyY = y + 2 * hr;
          const bodyH = Math.max(14, h - 2 * hr); // = 頭と同じ高さ（理想）
          const bodyR = 7;
          // 下半身の比率を従来の2倍に（上限0.9、下限0.1を確保）
          const baseTopRatio = design.shirtRatio;
          const bottomRatio = Math.min(0.9, (1 - baseTopRatio) * 2);
          const topRatio = Math.max(0.1, 1 - bottomRatio);
          // 上半身（シャツ：明るめ）
          const topH = Math.floor(bodyH * topRatio);
          const gTop = ctx.createLinearGradient(x, bodyY, x, bodyY + topH);
          gTop.addColorStop(0, palette.shirtGreen);
          gTop.addColorStop(1, palette.shirtGreenDark);
          ctx.fillStyle = gTop;
          roundRect(ctx, x, bodyY, w, topH, bodyR);
          ctx.fill();
          // 下半身（ズボン：暗め）
          const bottomY = bodyY + topH - Math.min(bodyR, 6); // 少し重ねて角の段差を軽減
          const bottomH = Math.floor(bodyH * bottomRatio) + Math.min(bodyR, 6);
          const gBot = ctx.createLinearGradient(x, bottomY, x, bottomY + bottomH);
          gBot.addColorStop(0, palette.pantsNavy);
          gBot.addColorStop(1, palette.pantsNavyDark);
          ctx.fillStyle = gBot;
          roundRect(ctx, x, bottomY, w, bottomH, Math.max(3, bodyR - 2));
          ctx.fill();
          // 胸部イエローライン（アクセント）
          ctx.fillStyle = palette.suitYellow;
          ctx.fillRect(x + 4, bodyY + 6, w - 8, 3);
          // 下端アクセントは削除（配色をシンプルに）

          // 胸のGエンブレム（黄）
          ctx.fillStyle = palette.suitYellow;
          ctx.font = 'bold 11px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('G', cx, bodyY + bodyH * 0.55);

          // 手足（簡易）：ポーズ変化
          const isAir = anim.air > 0.1;
          const goingUp = isAir && player.vy < -60;
          const goingDown = isAir && player.vy > 120;
          const armY = bodyY + 6;
          const legY = bodyY + bodyH - 2;
          const limbW = 3;
          const limbLen = 8;
          // 腕（上半身の色：緑）
          ctx.fillStyle = palette.shirtGreenDark;
          if (goingUp) {
            // 両腕を上げる
            ctx.fillRect(x - 2, armY - 8, limbW, limbLen + 6);
            ctx.fillRect(x + w - limbW + 2, armY - 8, limbW, limbLen + 6);
          } else if (goingDown) {
            // 両腕をやや後ろに（下へ）
            ctx.fillRect(x - 2, armY + 2, limbW, limbLen);
            ctx.fillRect(x + w - limbW + 2, armY + 2, limbW, limbLen);
          } else {
            // ニュートラル（少し外）
            ctx.fillRect(x - 2, armY, limbW, limbLen);
            ctx.fillRect(x + w - limbW + 2, armY, limbW, limbLen);
          }
          // 脚（下半身の色：紺）＋ 足は丸
          ctx.fillStyle = palette.pantsNavy;
          let legLenL = limbLen, legLenR = limbLen;
          let legYOffset = -1;
          if (goingUp) { legYOffset = -4; legLenL = limbLen - 2; legLenR = limbLen - 2; }
          else if (goingDown) { legYOffset = 0; legLenL = limbLen + 2; legLenR = limbLen + 2; }
          // 細い脚
          ctx.fillRect(cx - 6, legY + legYOffset, limbW, legLenL);
          ctx.fillRect(cx + 3, legY + legYOffset, limbW, legLenR);
          // 丸い足先
          const footR = 4.5;
          const fx1 = cx - 6 + limbW/2;
          const fx2 = cx + 3 + limbW/2;
          const fy = legY + legYOffset + Math.max(legLenL, legLenR) + 2 + (goingDown ? 2 : (goingUp ? -1 : 0));
          ctx.beginPath(); ctx.arc(fx1, fy, footR, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(fx2, fy, footR, 0, Math.PI*2); ctx.fill();

          // オーラ（軽さの表現）
          const aura = ctx.createRadialGradient(cx, cy, 4, cx, cy, hr * 1.2);
          aura.addColorStop(0, 'rgba(155,89,182,0.20)');
          aura.addColorStop(1, 'rgba(155,89,182,0)');
          ctx.fillStyle = aura;
          ctx.beginPath(); ctx.arc(cx, cy, hr * 1.2, 0, Math.PI * 2); ctx.fill();

          // フィーバー中の強化演出（発光・アウトライン）
          if (state.fever) {
            const t = state.time;
            const pulse = 0.6 + 0.4 * Math.sin(t * 10);
            // 追加オーラ（大きめ）
            const aura2 = ctx.createRadialGradient(cx, cy, 6, cx, cy, hr * 1.8);
            aura2.addColorStop(0, `rgba(255,230,120,${0.35 + 0.2*pulse})`);
            aura2.addColorStop(1, 'rgba(255,230,120,0)');
            ctx.fillStyle = aura2;
            ctx.beginPath(); ctx.arc(cx, cy, hr * 1.8, 0, Math.PI * 2); ctx.fill();

            // 頭部のゴールド縁取り
            ctx.strokeStyle = `rgba(255,220,120,${0.8})`;
            ctx.lineWidth = 2 + pulse;
            ctx.beginPath(); ctx.arc(cx, cy, hr + 2, 0, Math.PI * 2); ctx.stroke();

            // 胴体のゴールド縁取り
            const bodyY = y + 2 * hr;
            const bodyH = Math.max(14, h - 2 * hr);
            const bodyR = 7;
            ctx.lineWidth = 2;
            roundRect(ctx, x - 1, bodyY - 1, w + 2, bodyH + 2, bodyR + 2);
            ctx.stroke();
          }

          ctx.restore();
        }

        function drawShadow(x, y, w, h, anim) {
          ctx.save();
          const cx = x + w / 2;
          const sy = y + h + 8;
          const air = anim ? anim.air : 0;
          const alpha = 0.25 * (1 - 0.6 * air);
          const scale = 0.85; // 影スプライトを0.85倍
          const rx = Math.max(8, w * (0.7 - 0.25 * air) * scale);
          const ry = 5 * (1 - 0.4 * air) * scale;
          ctx.fillStyle = `rgba(0,0,0,${alpha.toFixed(3)})`;
          ctx.beginPath();
          ctx.ellipse(cx, sy, rx, Math.max(2, ry), 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        function roundRect(ctx, x, y, w, h, r) {
          const rr = Math.min(r, w/2, h/2);
          ctx.beginPath();
          ctx.moveTo(x + rr, y);
          ctx.arcTo(x + w, y, x + w, y + h, rr);
          ctx.arcTo(x + w, y + h, x, y + h, rr);
          ctx.arcTo(x, y + h, x, y, rr);
          ctx.arcTo(x, y, x + w, y, rr);
          ctx.closePath();
        }

        // Show intro overlay on load + ベスト表示の反映
        overlay.style.display = 'flex';
        try {
          const bestLine = document.getElementById('bestLine');
          if (bestLine) bestLine.textContent = `最高記録: ${state.best} m`;
        } catch (_) {}
      })();
    </script>
    <!-- Optional external phase controller: disabled to avoid 404
    <script src="scripts/phase-control.js"></script>
    -->
    <!-- 開発用ツール: ?dev=1 で有効化 -->
    <script src="scripts/dev-tools.js"></script>
    <script>
      // 予備ローダ: dev-toolsの404時にフォールバック読込
      (function(){
        try {
          const sp = new URL(location.href).searchParams;
          const devParam = (sp.get('dev')||'').trim();
          const devOn = devParam === '1' || devParam === '2';
          if (!devOn) return;
          setTimeout(function(){
            if (window.__DEV_TOOLS_LOADED) return;
            console.warn('[DEV-TOOLS] static include missing or 404, loading dynamically...');
            const s = document.createElement('script');
            s.src = 'scripts/dev-tools.js';
            s.async = true;
            s.onerror = function(){
              console.warn('[DEV-TOOLS] scripts/dev-tools.js 404, fallback to scripts/dev-tools-simple.js');
              const s2 = document.createElement('script');
              s2.src = 'scripts/dev-tools-simple.js';
              s2.async = true;
              document.body.appendChild(s2);
            };
            document.body.appendChild(s);
          }, 80);
        } catch(_) {}
      })();
    </script>
  </body>
